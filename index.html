<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050608">
  <meta name="description" content="mostel28 — басейн. Новий трек уже в жовтні.">
  <title>mostel28 — басейн</title>
  <link rel="preload" as="image" href="assets/avatar.png">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="teaser" id="teaser">
    <div class="scene" aria-hidden="true">
      <img class="scene__photo" src="assets/avatar.png" alt="">
      <div class="scene__bluewash"></div>
      <div class="scene__water"></div>
      <div class="scene__grain"></div>
      <div class="scene__vignette"></div>
      <div class="ripple ripple--one"></div>
      <div class="ripple ripple--two"></div>
      <div class="ripple ripple--three"></div>
      <div class="scanline"></div>
    </div>

    <header class="topbar">
      <a class="wordmark" href="#teaser" aria-label="mostel28 — на початок">
        <span class="wordmark__name">mostel28</span>
        <span class="wordmark__rule"></span>
        <span class="wordmark__caption">незабаром</span>
      </a>
      <div class="topbar__status"><span class="status-dot"></span> новий сингл</div>
    </header>

    <section class="hero" aria-labelledby="track-title">
      <div class="hero__copy">
        <p class="eyebrow reveal">ЗАНУРЕННЯ ПОЧИНАЄТЬСЯ</p>
        <h1 class="title reveal" id="track-title">басейн<span class="title__period">.</span></h1>
        <div class="hero__meta reveal">
          <span class="hero__artist">mostel28</span>
          <span class="meta-line"></span>
          <span class="hero__type">новий трек</span>
        </div>
        <p class="release reveal"><span>РЕЛІЗ</span><strong>У ЖОВТНІ</strong></p>
      </div>

      <div class="artwork reveal" aria-label="Обкладинка синглу mostel28 — басейн">
        <img src="assets/avatar.png" alt="Чорно-біла фотографія з синіми геометричними смугами">
        <div class="artwork__reflection"></div>
        <div class="artwork__label"><span>mostel28</span><span>басейн</span></div>
        <span class="artwork__index" aria-hidden="true">01 — 01</span>
      </div>

      <div class="hero__note reveal"><span class="note-cross">+</span><span>ВІДЧУЙ<br>ТИШУ ДО ДНА</span></div>
    </section>

    <footer class="footer">
      <button class="replay" id="replay" type="button">
        <span class="replay__icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>повторити занурення</span>
      </button>
      <div class="footer__hint"><span class="footer__line"></span><span>НА ГЛИБИНІ СТАЄ ТИХО</span></div>
      <span class="footer__year">M28&nbsp; / &nbsp;2026</span>
    </footer>
    <div class="pointer-ripple" aria-hidden="true"></div>
    <div class="sr-only" id="motion-status" aria-live="polite"></div>
  </main>
</body>
</html>
